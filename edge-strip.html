<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3.ini</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }

      /* 常驻的淡竹绿细条：平时半透明，鼠标移上去时稍微加深一点作为点击反馈。 */
      #strip {
        width: 100%;
        height: 100%;
        background: rgba(45, 90, 61, 0.28);
        cursor: pointer;
        transition: background 140ms ease;
      }

      #strip:hover {
        background: rgba(45, 90, 61, 0.6);
      }

      #strip:active {
        background: rgba(45, 90, 61, 0.85);
      }

      html[data-theme="dark"] #strip {
        background: rgba(162, 180, 120, 0.22);
      }

      html[data-theme="dark"] #strip:hover {
        background: rgba(162, 180, 120, 0.55);
      }

      html[data-theme="dark"] #strip:active {
        background: rgba(162, 180, 120, 0.8);
      }
    </style>
    <script>
      (function () {
        var opt = localStorage.getItem("theme-option");
        var t;
        if (opt === "light" || opt === "dark") {
          t = opt;
        } else {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>

  <body>
    <div id="strip"></div>
    <script type="module" src="/src/edge-strip.ts"></script>
  </body>
</html>
