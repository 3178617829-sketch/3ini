# 3.ini 构建流水线
#
# 说明：官方分发的成品是 ARM64（Snapdragon 笔记本）版本，由维护者在本地用
# build-arm64.bat 产出。这里在 GitHub 的 x64 runner 上编译 x64 版本，
# 目的是保证代码随时可构建、可安装，而不是替代本地 ARM64 出包流程。
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 类型检查与 Rust 编译
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 生成贡献者列表
        # 该文件被 .gitignore 排除，本地由 npm run build 顺带生成；CI 直接跑 tsc 会找不到它
        run: node scripts/fetch-contributors.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: TypeScript 类型检查
        run: npx tsc --noEmit

      - name: Rust 编译检查
        run: cargo check --manifest-path src-tauri/Cargo.toml

  build:
    name: 构建 Windows 安装包
    runs-on: windows-latest
    needs: check
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 构建应用
        run: npx tauri build --bundles nsis

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: 3ini-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
