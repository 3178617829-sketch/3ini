[package]
name = "floral-notepaper"
version = "1.2.0"
description = "3.ini — a local note app with a local AI assistant"
authors = ["YECEE"]
edition = "2021"
default-run = "floral-notepaper"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "floral_notepaper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 打包前端资源进 exe；不开这个 feature 时 debug 版会去连 devUrl (localhost:1420)。
# 官方模板默认写法：`cargo build` 不带该 feature，`cargo build --features custom-protocol` 或 release 时启用。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "macos-private-api"] }
tauri-plugin-cli = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-clipboard-manager = "2"
tokio = { version = "1", features = ["time"] }
trash = "5"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
sha2 = "0.10"
dirs = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Console",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# 面板天气条要真实的经纬度：Windows 系统定位走 WinRT。
# windows-sys 不投影 WinRT，必须用 windows crate 的 Devices_Geolocation feature；
# Geolocator::GetGeopositionAsync 返回 IAsyncOperation<T>，await 它要 windows-future。
windows = { version = "0.61", features = ["Devices_Geolocation"] }
windows-future = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
raw-window-handle = "0.6"
